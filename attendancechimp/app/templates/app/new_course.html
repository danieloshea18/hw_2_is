<!DOCTYPE html>
<html>
<head><title>New Course</title></head>
<body>
  <h1>Create Course</h1>
  <form method="POST" action="/app/createCourse/">
    {% csrf_token %}
    <label>Course Name:
      <input type="text" name="name" required>
    </label><br>
    <label>Course Code:
      <input type="text" name="code" required>
    </label><br>
    <button type="submit">Create Course</button>
  </form>
</body>
</html>
