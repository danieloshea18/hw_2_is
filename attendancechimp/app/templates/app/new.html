
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - AttendanceChimp</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 40px; }
        form { max-width: 400px; margin: 0 auto; text-align: left; }
        label { display: block; margin-top: 12px; }
        input[type="text"], input[type="email"], input[type="password"] { width: 100%; padding: 6px; }
        .radios label { display: inline; margin-right: 16px; }
        button { margin-top: 20px; padding: 8px 20px; }
    </style>
</head>
<body>
    <h1>Sign Up</h1>

    <form action="/app/createUser" method="post">
        {% csrf_token %}

        <label for="user_name">User name</label>
        <input type="text" id="user_name" name="user_name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <label>I am a:</label>
        <div class="radios">
            <label><input type="radio" name="is_student" value="true" checked> Student</label>
            <label><input type="radio" name="is_student" value="false"> Instructor</label>
        </div>

        <button type="submit">Sign Up</button>
    </form>
</body>
</html>
