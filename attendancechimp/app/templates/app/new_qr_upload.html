<!DOCTYPE html>
<html lang="en">
<head><title>New QR Upload</title></head>
<body>
    <h1>Upload QR Code</h1>
    <form action="/app/createQRCodeUpload" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <label>QR Code Image: <input type="file" name="imageUpload" required></label><br>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
